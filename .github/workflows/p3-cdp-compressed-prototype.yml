name: P3 compressed JSON CDP streaming experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cdp-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Playwright dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Run only local fixture; no external websites
        run: xvfb-run -a python -u -m tests.p3_cdp_decoded_length_experiment
