name: Step 2 + Step 3 Chromium fixture smoke

on:
  push:
    branches: [main]
    paths:
      - 'scan.py'
      - 'scanner/runtime_scan.py'
      - 'scanner/record_scan.py'
      - 'scanner/network.py'
      - 'scanner/connections.py'
      - 'scanner/runtime_detect.py'
      - 'scanner/chart_mapping.py'
      - 'scanner/bundle_scan.py'
      - 'tests/test_bundle_scan.py'
      - 'tests/browser_bundle_check.py'
      - 'tests/browser_final_check.py'
      - 'tests/public_runtime_smoke.py'
      - 'tests/test_chart_mapping.py'
      - 'tests/test_runtime_detect.py'
      - 'tests/test_connections.py'
      - 'tests/fixture_server.py'
      - 'tests/test_network.py'
      - 'tests/browser_runtime_check.py'
      - 'tests/browser_record_check.py'
      - 'tests/test_record.py'
      - 'tests/browser_mapping_check.py'
      - '.github/workflows/runtime-python311.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-fixture:
    name: Python 3.11 / real Chromium fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser local fixture test
        run: xvfb-run -a python -m pytest -q tests/browser_runtime_check.py tests/browser_mapping_check.py tests/browser_bundle_check.py tests/browser_final_check.py tests/browser_record_check.py
      - name: Optional public homepage static and runtime smoke (environment dependent)
        continue-on-error: true
        run: python -m pytest -q -s tests/public_runtime_smoke.py
