name: Linux Step 1 final regression verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-python311.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-py311:
    name: Fresh Ubuntu Python 3.11 fixture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create isolated virtual environment
        run: python -m venv .venv-ci

      - name: Install requirements
        run: .venv-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline fixture regression tests
        run: .venv-ci/bin/python -m pytest -q
